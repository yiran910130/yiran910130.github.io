name: Complete website resources
on:
  push:
    paths:
      - '.github/workflows/restore-html.yml'
permissions:
  contents: write
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public academic site resources
        run: |
          python - &lt;&lt;'PY'
          import base64
          from pathlib import Path
          files = {
              'assets/favicon.svg': '',
 'data/publications.bib': '',
              'robots.txt': 'VXNlci1hZ2VudDogKgpBbGxvdzogLwpTaXRlbWFwOiBodHRwczovL3lpcmFuOTEwMTMwLmdpdGh1Yi5pby9zaXRlbWFwLnhtbAo=',
              'sitemap.xml': ''
          }
          for name, encoded in files.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))
          Path('.nojekyll').touch()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll assets/favicon.svg data/publications.bib robots.txt sitemap.xml
          git commit -m "Add favicon, BibTeX, and site discovery files" || exit 0
          git push
